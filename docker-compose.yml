services:
  keap-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: keap-mcp:latest
    container_name: keap-mcp-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - MCP_TRANSPORT=http
      - MCP_HTTP_PORT=8080
      - AUTH_MODE=${AUTH_MODE:-gateway}

volumes: {}
